<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1994 X HDB CTA Lineup & Regear System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    .bg-caller { background-color: #0891b2 !important; border-color: #06b6d4 !important; }
    .bg-tank { background-color: #4c1d95 !important; border-color: #6d28d9 !important; }
    .bg-dps { background-color: #78350f !important; border-color: #b45309 !important; }
    .bg-support { background-color: #b45309 !important; border-color: #f59e0b !important; }
    .bg-healer { background-color: #064e3b !important; border-color: #059669 !important; }
    .bg-flex { background-color: #581c87 !important; border-color: #7e22ce !important; }
    
    .slot-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slot-card:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }
  </style>
</head>
<body class="p-3 md:p-8 min-h-screen">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- 頂欄：標題 + UTC + 頁面切換 -->
    <div class="flex flex-col lg:flex-row justify-between items-center gap-4 bg-slate-800/90 p-5 md:p-6 rounded-2xl border border-slate-700 shadow-2xl">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl font-black">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-cyan-400 to-emerald-400">
            1994 X HDB
          </h1>
        </div>
      </div>

      <!-- 控制區 -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- UTC 切換 (在战报页面自动隐藏) -->
        <div id="utc-selector-group" class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
          <button id="utc-12" onclick="switchUTC('12')" class="px-3.5 py-1.5 rounded-md font-bold text-xs bg-amber-500 text-slate-950 shadow">
            12 UTC
          </button>
          <button id="utc-14" onclick="switchUTC('14')" class="px-3.5 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white">
            14 UTC
          </button>
        </div>

        <!-- 阵容与 Regear 功能切換 -->
        <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
          <button id="tab-main" onclick="switchTab('main')" class="px-3 py-1.5 rounded-md font-bold text-xs bg-cyan-600 text-white">
            <i class="fa-solid fa-users mr-1"></i>陣容報名
          </button>
          <button id="tab-regear1" onclick="switchTab('regear1')" class="px-3 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white">
            <i class="fa-solid fa-rotate-left mr-1"></i>12 UTC REGEAR
          </button>
          <button id="tab-regear2" onclick="switchTab('regear2')" class="px-3 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white">
            <i class="fa-solid fa-rotate-left mr-1"></i>14 UTC REGEAR
          </button>
        </div>

        <!-- 完全独立的战报大按钮 -->
        <button id="tab-battles" onclick="switchTab('battles')" class="px-4 py-2 rounded-lg font-extrabold text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/40 shadow-lg flex items-center gap-1.5 transition-all">
          <i class="fa-solid fa-chart-line text-sm"></i> 戰報與勝率
        </button>
      </div>
    </div>

    <!-- 狀態指示與金額彙總 Banner (进入战报页面自动隐藏) -->
    <div id="sub-header-banner" class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span id="utc-badge" class="px-3 py-1 bg-amber-500/20 text-amber-300 font-extrabold border border-amber-500/40 rounded-lg text-sm">
          12 UTC
        </span>
      </div>

      <!-- 右上角 Regear 總金額統計 -->
      <div id="regear-total-box" class="hidden flex items-center gap-4 bg-emerald-950/80 border border-emerald-600/80 px-5 py-2.5 rounded-lg">
        <div>
          <div class="text-xs text-emerald-300/80 uppercase font-semibold">本場總死亡次數</div>
          <div class="text-lg font-black text-emerald-400" id="total-deaths-val">0 次</div>
        </div>
        <div class="h-8 w-px bg-emerald-700/60"></div>
        <div>
          <div class="text-xs text-emerald-300/80 uppercase font-semibold">本場賠付總金額</div>
          <div class="text-xl font-black text-amber-300" id="total-money-val">0 銀幣</div>
        </div>
      </div>

      <button onclick="clearAllData()" class="px-3 py-1.5 bg-red-900/40 hover:bg-red-800 border border-red-700 text-red-200 text-xs rounded transition-all">
        <i class="fa-solid fa-trash-can mr-1"></i>清空當前數據
      </button>
    </div>

    <!-- 主要坑位表格渲染區 -->
    <div id="app-container" class="space-y-8"></div>

    <!-- 戰報與勝率統計頁面 (預設隱藏) -->
    <div id="battles-container" class="hidden space-y-6">
      <!-- 頂部勝率統計 Banner -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div class="bg-slate-800/90 border border-slate-700 p-4 rounded-xl text-center">
          <div class="text-xs text-slate-400 font-bold uppercase">總勝率</div>
          <div class="text-2xl md:text-3xl font-black text-amber-400 mt-1" id="stat-win-rate">0%</div>
        </div>
        <div class="bg-slate-800/90 border border-slate-700 p-4 rounded-xl text-center">
          <div class="text-xs text-slate-400 font-bold uppercase">戰績 (勝/負)</div>
          <div class="text-xl md:text-2xl font-black text-white mt-1" id="stat-record">0勝 0負</div>
        </div>
        <div class="bg-slate-800/90 border border-slate-700 p-4 rounded-xl text-center col-span-2 md:col-span-1">
          <div class="text-xs text-slate-400 font-bold uppercase">公会击杀 / 死亡</div>
          <div class="text-xl md:text-2xl font-black text-emerald-400 mt-1" id="stat-kd">0 / 0</div>
        </div>
      </div>

      <!-- 公会绑定与一键拉取战报 -->
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl space-y-4 shadow-lg">
        <div class="flex flex-col md:flex-row justify-between md:items-center gap-2 border-b border-slate-700 pb-3">
          <div>
            <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
              <i class="fa-solid fa-cloud-arrow-down"></i> 官方战报自动检索
            </h3>
            <p class="text-xs text-slate-400 mt-0.5">检索目标公会: <span class="font-mono text-cyan-400 font-bold">1994</span> (基于 Albion 官方 Killboard 数据源)</p>
          </div>
          <button onclick="fetchGuildBattles()" id="btn-fetch-guild" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs px-4 py-2.5 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg">
            <i class="fa-solid fa-arrows-rotate"></i> 自动检索 1994 官方战报
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
          <input type="text" id="battle-id-input" placeholder="输入官方 Battle ID (例: 115524564) 或 战报链接" class="md:col-span-2 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
          <button onclick="fetchOrAddBattle()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm px-4 py-2.5 rounded-lg transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i> 解析并添加战报
          </button>
        </div>
      </div>

      <!-- 戰報列表 -->
      <div class="space-y-4">
        <h3 class="text-base font-bold text-slate-200 border-b border-slate-700 pb-2 flex items-center justify-between">
          <span><i class="fa-solid fa-list-check text-cyan-400 mr-2"></i>已计入胜率的战报列表</span>
          <span class="text-xs font-normal text-slate-400">可点击链接前往官方 Killboard 或其他平台查看</span>
        </h3>
        <div id="battle-list" class="space-y-3"></div>
      </div>
    </div>

  </div>

  <!-- 報名彈窗 Modal -->
  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-600 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="border-b border-slate-700 pb-2">
        <h3 class="text-xl font-bold text-amber-400" id="modal-title">坑位報名</h3>
        <p class="text-xs text-slate-400 mt-1" id="modal-subtitle"></p>
      </div>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">玩家 ID</label>
          <input type="text" id="input-name" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-cyan-500" placeholder="例如：Fu0115">
        </div>

        <div id="weapon-select-box" class="hidden">
          <label class="block text-xs font-semibold text-amber-400 uppercase mb-1">選擇使用武器</label>
          <select id="input-weapon" class="w-full bg-slate-900 border border-amber-600/60 rounded p-2.5 text-amber-200 focus:outline-none">
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">備註 (例如：可切裝/缺藥水)</label>
          <input type="text" id="input-note" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-cyan-500" placeholder="可不填">
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold rounded">取消</button>
        <button onclick="saveSlot()" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-bold rounded">確認保存</button>
      </div>
    </div>
  </div>

  <script>
    const GUILD_NAME = "1994";

    let currentUTC = '12';
    let currentTab = 'main';
    let activeSlotId = null;

    const DPS_WEAPONS = [
      "Spike刺拳 (平10)", "Realmbreaker裂域斧", "Carrioncaller噬魂斧", "Runic 符文大剑",
      "Permafrost 冰波法杖", "Dawnsong 晨曦火", "Wildfire 野火法杖", "Brimstone 陨石火",
      "Longbow 长弓", "Mistpiercer 穿雾弓", "Siegebow 聪明炮", "Energy Crossbow 能量弩",
      "Clarent 澄清剑", "Bridled Passion 狂热匕首", "Bloodletter 破血匕首", "Galatine 双圣剑",
      "Demonfang 恶魔牙", "Shadowcaller 影召法杖"
    ];

    const COMP_CATEGORIES = [
      { 
        title: "CALLER", 
        colorClass: "bg-caller", 
        slots: [
          { id: "c1", defaultReq: "CALLER 1" },
          { id: "c2", defaultReq: "CALLER 2" }
        ] 
      },
      {
        title: "DTANK 防坦", 
        colorClass: "bg-tank",
        slots: [
          { id: "t1", defaultReq: "單手錘/風暴錘/雷霆錘/正手/釘錘" },
          { id: "t2", defaultReq: "單手錘/風暴錘/雷霆錘/正手/釘錘" },
          { id: "t3", defaultReq: "Incubus縮小" }
        ]
      },
      {
        title: "DPS", 
        colorClass: "bg-dps",
        slots: [
          { id: "d1", defaultReq: "Spike刺拳 (平10)" },
          { id: "d2", defaultReq: "Realmbreaker裂域斧" },
          { id: "d3", defaultReq: "DPS 自由位 1", isDpsSelect: true },
          { id: "d4", defaultReq: "DPS 自由位 2", isDpsSelect: true },
          { id: "d5", defaultReq: "DPS 自由位 3", isDpsSelect: true },
          { id: "d6", defaultReq: "DPS 自由位 4", isDpsSelect: true },
          { id: "d7", defaultReq: "DPS 自由位 5", isDpsSelect: true },
          { id: "d8", defaultReq: "DPS 自由位 6", isDpsSelect: true }
        ]
      },
      {
        title: "Support 辅助/破防",
        colorClass: "bg-support",
        slots: [
          { id: "s1", defaultReq: "Spirithunter索魂/Carving斷水" },
          { id: "s2", defaultReq: "shadowcaller昭穎" },
          { id: "s3", defaultReq: "Corrupting Staff生咒" }
        ]
      },
      {
        title: "HEALER 奶妈", 
        colorClass: "bg-healer",
        slots: [
          { id: "h1", defaultReq: "Hallowfall版甲堕神" },
          { id: "h2", defaultReq: "Hallowfall堕神" },
          { id: "h3", defaultReq: "Fallen堕落法杖" },
          { id: "h4", defaultReq: "水晶奶" }
        ]
      },
      {
        title: "FLEX 补位", 
        colorClass: "bg-flex",
        slots: [
          { id: "f1", defaultReq: "补位坑 1", isDpsSelect: true },
          { id: "f2", defaultReq: "补位坑 2", isDpsSelect: true },
          { id: "f3", defaultReq: "补位坑 3", isDpsSelect: true },
          { id: "f4", defaultReq: "补位坑 4", isDpsSelect: true },
          { id: "f5", defaultReq: "补位坑 5", isDpsSelect: true }
        ]
      }
    ];

    function getStoreKey(type) {
      return `albion_${currentUTC}_${type}`;
    }

    function getData(type) {
      return JSON.parse(localStorage.getItem(getStoreKey(type)) || '{}');
    }

    function saveData(type, data) {
      localStorage.setItem(getStoreKey(type), JSON.stringify(data));
    }

    function switchUTC(utc) {
      currentUTC = utc;
      document.getElementById('utc-12').className = utc === '12' ? 'px-3.5 py-1.5 rounded-md font-bold text-xs bg-amber-500 text-slate-950 shadow' : 'px-3.5 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white';
      document.getElementById('utc-14').className = utc === '14' ? 'px-3.5 py-1.5 rounded-md font-bold text-xs bg-amber-500 text-slate-950 shadow' : 'px-3.5 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white';
      document.getElementById('utc-badge').innerText = `${utc} UTC`;
      renderApp();
    }

    function switchTab(tabName) {
      currentTab = tabName;
      
      if(tabName === 'regear1') switchUTC('12');
      if(tabName === 'regear2') switchUTC('14');

      ['main', 'regear1', 'regear2'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if(btn) {
          btn.className = t === tabName ? "px-3 py-1.5 rounded-md font-bold text-xs bg-cyan-600 text-white shadow" : "px-3 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
        }
      });

      const battleBtn = document.getElementById('tab-battles');
      if(battleBtn) {
        battleBtn.className = tabName === 'battles' 
          ? "px-4 py-2 rounded-lg font-extrabold text-xs bg-amber-500 text-slate-950 border border-amber-400 shadow-lg flex items-center gap-1.5 transition-all" 
          : "px-4 py-2 rounded-lg font-extrabold text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/40 shadow-lg flex items-center gap-1.5 transition-all";
      }

      const regearTotalBox = document.getElementById('regear-total-box');
      const appContainer = document.getElementById('app-container');
      const battlesContainer = document.getElementById('battles-container');
      const utcGroup = document.getElementById('utc-selector-group');
      const subBanner = document.getElementById('sub-header-banner');

      if(tabName === 'battles') {
        if(appContainer) appContainer.classList.add('hidden');
        if(battlesContainer) battlesContainer.classList.remove('hidden');
        if(regearTotalBox) regearTotalBox.classList.add('hidden');
        
        // 彻底隐藏 UTC 班次选择器和下面的 12 UTC Banner
        if(utcGroup) utcGroup.classList.add('hidden');
        if(subBanner) subBanner.classList.add('hidden');
        
        renderBattles();
      } else {
        if(appContainer) appContainer.classList.remove('hidden');
        if(battlesContainer) battlesContainer.classList.add('hidden');
        
        // 恢复显示 UTC 选择器和 Banner
        if(utcGroup) utcGroup.classList.remove('hidden');
        if(subBanner) subBanner.classList.remove('hidden');

        if(tabName === 'main') {
          if(regearTotalBox) regearTotalBox.classList.add('hidden');
        } else {
          if(regearTotalBox) regearTotalBox.classList.remove('hidden');
        }
        renderApp();
      }
    }

    function getBattleData() {
      return JSON.parse(localStorage.getItem('albion_battles_records') || '[]');
    }

    function saveBattleData(data) {
      localStorage.setItem('albion_battles_records', JSON.stringify(data));
    }

    // 自动抓取公会战报 API（直接以官方 API 为标准，按公会名称 1994 检索）
    async function fetchGuildBattles() {
      const btn = document.getElementById('btn-fetch-guild');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在检索官方战报...`;
      btn.disabled = true;

      const directUrl = `https://gameinfo-sgp.albiononline.com/api/gameinfo/battles?limit=30&offset=0`;
      let battleList = null;

      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(directUrl)}`);
        if (res.ok) {
          const wrapper = await res.json();
          if (wrapper.contents) {
            battleList = JSON.parse(wrapper.contents);
          }
        }
      } catch (err) {
        console.warn("Proxy 1 failed", err);
      }

      if (!battleList || !Array.isArray(battleList)) {
        try {
          const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(directUrl)}`);
          if (res.ok) {
            battleList = await res.json();
          }
        } catch (err) {
          console.warn("Proxy 2 failed", err);
        }
      }

      try {
        if (!battleList || !Array.isArray(battleList)) {
          throw new Error("CORS_BLOCKED");
        }

        const battles = getBattleData();
        let addedCount = 0;

        battleList.forEach(data => {
          // 官方 API 查找 1994 公会
          let guildData = null;
          if (data.guilds) {
            guildData = Object.values(data.guilds).find(g => g.name && g.name.toLowerCase() === GUILD_NAME.toLowerCase());
          }

          if (guildData) {
            const battleId = String(data.id);
            if (!battles.some(b => b.id === battleId)) {
              const kills = guildData.kills || 0;
              const deaths = guildData.deaths || 0;
              const isWin = kills >= deaths;
              const playersCount = guildData.totalPlayers || guildData.players || 10;

              battles.unshift({
                id: battleId,
                time: new Date(data.startTime || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                result: isWin ? 'win' : 'loss',
                players: playersCount,
                kills: kills,
                deaths: deaths,
                officialUrl: `https://albiononline.com/killboard/battles/${battleId}`,
                bbUrl: `https://albionbb.com/battles/${battleId}`,
                abUrl: `https://albionbattles.com/battles/${battleId}`
              });
              addedCount++;
            }
          }
        });

        saveBattleData(battles);
        renderBattles();
        if (addedCount > 0) {
          alert(`成功拉取官方最新数据，增加了 ${addedCount} 场 1994 的战报！`);
        } else {
          alert(`检索完成！未发现新的 1994 官方战报（或已在列表中）。`);
        }
      } catch(e) {
        console.warn("CORS fetch failed:", e);
        alert("官方 API 跨域读取受限，请在上方输入框粘贴具体的 Battle ID (如 115524564)，系统会直接解析并添加！");
      } finally {
        btn.innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> 自动检索 1994 官方战报`;
        btn.disabled = false;
      }
    }

    async function fetchOrAddBattle() {
      const input = document.getElementById('battle-id-input').value.trim();
      if(!input) return alert("请先输入 Battle ID 或战报链接");

      const match = input.match(/\d+/);
      const battleId = match ? match[0] : input;

      const battles = getBattleData();
      if(battles.some(b => b.id === battleId)) {
        return alert("该战报已在列表中！");
      }

      const newBattle = {
        id: battleId,
        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
        result: 'win',
        players: 10,
        kills: 0,
        deaths: 0,
        officialUrl: `https://albiononline.com/killboard/battles/${battleId}`,
        bbUrl: `https://albionbb.com/battles/${battleId}`,
        abUrl: `https://albionbattles.com/battles/${battleId}`
      };

      const directUrl = `https://gameinfo-sgp.albiononline.com/api/gameinfo/battles/${battleId}`;
      
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(directUrl)}`);
        if (res.ok) {
          const wrapper = await res.json();
          if (wrapper.contents) {
            const data = JSON.parse(wrapper.contents);
            let guildData = null;
            if (data.guilds) {
              guildData = Object.values(data.guilds).find(g => g.name && g.name.toLowerCase() === GUILD_NAME.toLowerCase());
            }
            newBattle.kills = guildData ? (guildData.kills || 0) : (data.totalKills || 0);
            newBattle.deaths = guildData ? (guildData.deaths || 0) : 0;
            newBattle.players = guildData ? (guildData.totalPlayers || 10) : (data.totalPlayers || 10);
            newBattle.result = newBattle.kills >= newBattle.deaths ? 'win' : 'loss';
          }
        }
      } catch(e) {
        console.warn("Manual battle lookup fallback used.", e);
      }

      battles.unshift(newBattle);
      saveBattleData(battles);
      document.getElementById('battle-id-input').value = '';
      renderBattles();
    }

    function updateBattleResult(index, field, value) {
      const battles = getBattleData();
      battles[index][field] = value;
      saveBattleData(battles);
      renderBattles();
    }

    function deleteBattle(index) {
      const battles = getBattleData();
      battles.splice(index, 1);
      saveBattleData(battles);
      renderBattles();
    }

    function renderBattles() {
      const battles = getBattleData();
      const listEl = document.getElementById('battle-list');
      if(!listEl) return;
      listEl.innerHTML = '';

      let wins = 0, losses = 0;
      let totalKills = 0, totalDeaths = 0;

      battles.forEach((b, idx) => {
        if(b.result === 'win') wins++;
        else losses++;

        totalKills += parseInt(b.kills || 0);
        totalDeaths += parseInt(b.deaths || 0);

        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4 shadow-md";
        
        card.innerHTML = `
          <div class="flex items-center gap-3 w-full md:w-auto">
            <select onchange="updateBattleResult(${idx}, 'result', this.value)" class="bg-slate-900 border rounded-lg px-2.5 py-1.5 text-xs font-bold ${b.result === 'win' ? 'text-emerald-400 border-emerald-500' : 'text-red-400 border-red-500'}">
              <option value="win" ${b.result === 'win' ? 'selected' : ''}>🟢 胜利</option>
              <option value="loss" ${b.result === 'loss' ? 'selected' : ''}>🔴 败北</option>
            </select>
            <div>
              <div class="text-sm font-bold text-white flex items-center gap-2">
                <span>Battle ID: #${b.id}</span>
                <span class="text-xs font-mono text-cyan-300 bg-cyan-950/80 px-2 py-0.5 rounded border border-cyan-800">
                  <i class="fa-solid fa-users text-[10px] mr-1"></i>1994 参战: ${b.players || 10}人
                </span>
              </div>
              <div class="text-xs text-slate-400 mt-1 flex flex-wrap items-center gap-3">
                <a href="${b.officialUrl}" target="_blank" class="text-emerald-400 hover:underline flex items-center gap-1">
                  <i class="fa-solid fa-external-link text-[10px]"></i> 官方 Killboard
                </a>
                <a href="${b.bbUrl}" target="_blank" class="text-amber-400 hover:underline flex items-center gap-1">
                  <i class="fa-solid fa-external-link text-[10px]"></i> AlbionBB
                </a>
                <a href="${b.abUrl}" target="_blank" class="text-cyan-400 hover:underline flex items-center gap-1">
                  <i class="fa-solid fa-external-link text-[10px]"></i> AlbionBattles
                </a>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-4 text-xs">
            <div>
              <span class="text-slate-400 block font-semibold">击杀 / 死亡</span>
              <div class="flex items-center gap-1 mt-0.5">
                <input type="number" min="0" value="${b.kills || 0}" onchange="updateBattleResult(${idx}, 'kills', this.value)" class="w-14 bg-slate-900 border border-slate-700 text-center rounded text-emerald-400 font-bold p-1">
                <span>/</span>
                <input type="number" min="0" value="${b.deaths || 0}" onchange="updateBattleResult(${idx}, 'deaths', this.value)" class="w-14 bg-slate-900 border border-slate-700 text-center rounded text-red-400 font-bold p-1">
              </div>
            </div>

            <button onclick="deleteBattle(${idx})" class="text-slate-500 hover:text-red-400 p-2 transition-all"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        `;

        listEl.appendChild(card);
      });

      const totalBattles = wins + losses;
      const winRate = totalBattles > 0 ? Math.round((wins / totalBattles) * 100) : 0;

      document.getElementById('stat-win-rate').innerText = `${winRate}%`;
      document.getElementById('stat-record').innerText = `${wins}胜 ${losses}负`;
      document.getElementById('stat-kd').innerText = `${totalKills} / ${totalDeaths}`;
    }

    function renderApp() {
      const container = document.getElementById('app-container');
      if (!container) return;
      container.innerHTML = '';

      const mainData = getData('main');
      const regearData = getData(currentTab);

      let grandTotalDeaths = 0;
      let grandTotalMoney = 0;

      COMP_CATEGORIES.forEach(cat => {
        const catBox = document.createElement('div');
        catBox.className = 'space-y-3';

        let filledCount = 0;
        cat.slots.forEach(s => { if(mainData[s.id]?.name) filledCount++; });

        catBox.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-700/80 pb-2">
            <h2 class="text-sm md:text-base font-extrabold text-slate-200 flex items-center gap-2">
              <span class="w-3 h-3 rounded-full ${cat.colorClass.replace('bg-', 'bg-')} inline-block"></span>
              ${cat.title}
            </h2>
            <span class="text-xs font-mono font-bold px-2.5 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
              ${filledCount} / ${cat.slots.length} 人填坑
            </span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
        `;

        container.appendChild(catBox);
        const grid = catBox.querySelector(`.grid`);

        cat.slots.forEach(slot => {
          const slotMain = mainData[slot.id] || {};
          const slotRg = regearData[slot.id] || { deaths: 0, price: 0 };

          const weaponName = slotMain.weapon || slot.defaultReq;
          const deaths = parseInt(slotRg.deaths || 0);
          const price = parseInt(slotRg.price || 0);
          const totalCost = deaths * price;

          if(currentTab !== 'main') {
            grandTotalDeaths += deaths;
            grandTotalMoney += totalCost;
          }

          const card = document.createElement('div');
          card.className = `slot-card p-3.5 rounded-xl border transition-all flex flex-col justify-between shadow-lg relative min-h-[110px] ${cat.colorClass}`;

          if(currentTab === 'main') {
            card.onclick = () => openModal(slot.id);
            card.innerHTML = `
              <div>
                <div class="text-xs font-black text-amber-200/90 truncate mb-1">
                  ${weaponName}
                </div>
                <div class="text-sm md:text-base font-extrabold text-white truncate">
                  ${slotMain.name ? `👤 ${slotMain.name}` : '<span class="text-slate-300/60 italic font-semibold text-xs">點擊這裡/Click here...</span>'}
                </div>
                ${slotMain.note ? `<div class="text-xs text-slate-200/90 mt-1 truncate font-medium">📝 ${slotMain.note}</div>` : ''}
              </div>
              <div class="mt-3 pt-2 border-t border-white/10 text-right">
                <button class="text-xs font-bold text-white hover:underline">
                  ${slotMain.name ? '修改/退坑' : '點擊這裡/Click here'}
                </button>
              </div>
            `;
          } else {
            card.innerHTML = `
              <div>
                <div class="text-xs font-black text-amber-200/90 truncate mb-0.5">${weaponName}</div>
                <div class="text-sm font-extrabold text-white truncate">
                  ${slotMain.name ? `👤 ${slotMain.name}` : '<span class="text-slate-300/50 italic text-xs">空坑位</span>'}
                </div>
              </div>

              <div class="mt-2 pt-2 border-t border-white/10 space-y-1.5">
                <div class="grid grid-cols-2 gap-1 text-xs">
                  <div>
                    <span class="text-[10px] text-slate-200 block font-semibold">死亡次數</span>
                    <input type="number" min="0" value="${deaths}" onchange="updateRegear('${slot.id}', 'deaths', this.value)" 
                           class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-2 py-1 text-white font-bold text-xs focus:outline-none focus:border-amber-400">
                  </div>
                  <div>
                    <span class="text-[10px] text-slate-200 block font-semibold">一套單價</span>
                    <input type="number" min="0" step="100000" value="${price}" onchange="updateRegear('${slot.id}', 'price', this.value)" 
                           class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-2 py-1 text-amber-300 font-bold text-xs focus:outline-none focus:border-amber-400">
                  </div>
                </div>
                
                <div class="flex justify-between items-center text-xs pt-1 font-bold">
                  <span class="text-slate-200 text-[10px]">個人總額:</span>
                  <span class="${totalCost > 0 ? 'text-amber-300 font-black' : 'text-slate-400'}">${totalCost.toLocaleString()} 銀幣</span>
                </div>
              </div>
            `;
          }

          grid.appendChild(card);
        });
      });

      if(currentTab !== 'main') {
        const totalDeathsEl = document.getElementById('total-deaths-val');
        const totalMoneyEl = document.getElementById('total-money-val');
        if (totalDeathsEl) totalDeathsEl.innerText = `${grandTotalDeaths} 次`;
        if (totalMoneyEl) totalMoneyEl.innerText = `${grandTotalMoney.toLocaleString()} 銀幣`;
      }
    }

    function updateRegear(slotId, field, val) {
      const data = getData(currentTab);
      if(!data[slotId]) data[slotId] = { deaths: 0, price: 0 };
      data[slotId][field] = parseInt(val) || 0;
      saveData(currentTab, data);
      renderApp();
    }

    function openModal(slotId) {
      activeSlotId = slotId;
      let slotConfig;
      COMP_CATEGORIES.forEach(c => {
        const found = c.slots.find(s => s.id === slotId);
        if(found) slotConfig = found;
      });

      const mainData = getData('main');
      const slotData = mainData[slotId] || {};

      document.getElementById('input-name').value = slotData.name || '';
      document.getElementById('input-note').value = slotData.note || '';
      document.getElementById('modal-subtitle').innerText = slotConfig.isDpsSelect ? '可自由選取使用武器' : `武器要求: ${slotConfig.defaultReq}`;

      const weaponSelectBox = document.getElementById('weapon-select-box');
      const weaponSelect = document.getElementById('input-weapon');

      if(slotConfig.isDpsSelect) {
        weaponSelectBox.classList.remove('hidden');
        weaponSelect.innerHTML = DPS_WEAPONS.map(w => `<option value="${w}" ${slotData.weapon === w ? 'selected' : ''}>${w}</option>`).join('');
      } else {
        weaponSelectBox.classList.add('hidden');
      }

      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function saveSlot() {
      const mainData = getData('main');
      const name = document.getElementById('input-name').value.trim();
      const note = document.getElementById('input-note').value.trim();
      const weaponSelectBox = document.getElementById('weapon-select-box');
      let weapon = '';

      if(!weaponSelectBox.classList.contains('hidden')) {
        weapon = document.getElementById('input-weapon').value;
      }

      if(!name) {
        delete mainData[activeSlotId];
      } else {
        mainData[activeSlotId] = { name, note, weapon };
      }

      saveData('main', mainData);
      closeModal();
      renderApp();
    }

    function clearAllData() {
      if(confirm(`確定要清空 ${currentUTC} UTC 的數據嗎？`)) {
        localStorage.removeItem(getStoreKey('main'));
        localStorage.removeItem(getStoreKey('regear1'));
        localStorage.removeItem(getStoreKey('regear2'));
        renderApp();
      }
    }

    // 初始化渲染
    renderApp();
  </script>
</body>
</html>
