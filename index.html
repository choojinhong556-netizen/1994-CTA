<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿爾比恩戰隊陣容与战损结算系统</title>
    <!-- 引入 Tailwind CSS 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
        .grid-container { display: grid; gap: 1rem; }
        .slot-card { cursor: pointer; padding: 0.75rem; border-radius: 0.75rem; border-width: 1px; border-style: solid; transition: all 0.2s; }
        .slot-card:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .btn-action { transition: all 0.2s; cursor: pointer; }
        .btn-action:hover { opacity: 0.9; }
        .modal-backdrop { position: fixed; inset: 0; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .modal-backdrop.flex { display: flex; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-3 md:p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Banner Header -->
        <div class="bg-gradient-to-r from-gray-900 via-gray-850 to-gray-900 p-4 md:p-6 rounded-2xl border border-gray-800 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl font-black">
                    <i class="fa-solid fa-shield-cat"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black text-white flex items-center gap-2">
                        Albion Online CTA 陣容報名
                    </h1>
                    <p class="text-xs text-gray-400">12:00 UTC & 14:00 UTC 雙場次即時坑位預约</p>
                </div>
            </div>

            <div class="flex items-center gap-4 text-xs font-mono">
                <div class="bg-black/50 px-3 py-1.5 rounded-lg border border-gray-800">
                    <span class="text-gray-400">當前 UTC: </span>
                    <span id="utcClock" class="text-amber-400 font-bold">--:--:-- UTC</span>
                </div>
                <div class="bg-black/50 px-3 py-1.5 rounded-lg border border-gray-800">
                    <span class="text-gray-400">下場 CTA: </span>
                    <span id="ctaCountdown" class="text-emerald-400 font-bold">--:--:--</span>
                </div>
            </div>
        </div>

        <!-- Active CTA Selection & Quick Action Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4 bg-gray-900 p-4 rounded-2xl border border-gray-800">
            <div class="flex items-center gap-3">
                <button id="btnSlot12" onclick="selectSlot('12')" class="btn-action flex-1 md:flex-initial px-6 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-crosshairs"></i> 12:00 UTC 集合 (<span id="count12">0 人</span>)
                </button>
                <button id="btnSlot14" onclick="selectSlot('14')" class="btn-action flex-1 md:flex-initial px-6 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-gray-800 text-gray-300 border border-gray-700">
                    <i class="fa-solid fa-crosshairs"></i> 14:00 UTC 集合 (<span id="count14">0 人</span>)
                </button>
            </div>

            <div class="flex items-center justify-between sm:justify-end gap-4">
                <div class="text-right">
                    <span class="text-xs text-gray-400 block font-semibold">当前场次入坑人数</span>
                    <span id="totalCountDisplay" class="text-lg font-black text-amber-400 font-mono">0 / 25</span>
                </div>
                <button onclick="exportToDiscord()" class="btn-action px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow flex items-center gap-2 text-sm">
                    <i class="fa-brands fa-discord text-base"></i> 複製 DC 排版名單
                </button>
            </div>
        </div>

        <!-- Main Comp Grid Container -->
        <div id="compGridContainer" class="space-y-4"></div>
    </div>

    <!-- Modal: Input Name Modal -->
    <div id="slotModal" class="modal-backdrop">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <div>
                    <h3 id="modalRoleTitle" class="text-lg font-bold text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-crosshairs"></i> 選擇坑位報名
                    </h3>
                    <p id="modalWeaponSub" class="text-xs text-gray-400 mt-0.5"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form onsubmit="confirmSlot(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-300 block mb-1">玩家 ID (In-Game ID)</label>
                    <input type="text" id="modalInputName" required placeholder="例如: FuDog" 
                           class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-amber-500 outline-none">
                </div>

                <!-- DPS 下拉選擇武器 (仅在 DPS 坑位显示) -->
                <div id="dpsWeaponDropdownContainer" class="hidden">
                    <label class="text-xs font-bold text-amber-400 block mb-1">選擇使用之 DPS 武器</label>
                    <select id="modalInputWeapon" class="w-full bg-gray-950 border border-amber-500/50 rounded-xl px-3 py-2.5 text-sm text-amber-200 focus:border-amber-400 outline-none">
                        <option value="RiftGlaive刺刀">RiftGlaive刺刀</option>
                        <option value="Dawnsong火鳥">Dawnsong火鳥</option>
                        <option value="Longbow長弓">Longbow長弓</option>
                        <option value="Demonfang惡魔牙">Demonfang惡魔牙</option>
                        <option value="Shaper聰明砲">Shaper聰明砲</option>
                        <option value="gala聰明雙刀">gala聰明雙刀</option>
                        <option value="Siegebow圍城弩">Siegebow圍城弩</option>
                        <option value="Kingmaker傭王">Kingmaker傭王</option>
                        <option value="Realmbreaker破戒">Realmbreaker破戒</option>
                        <option value="Bridledfury拳刃">Bridledfury拳刃</option>
                        <option value="Battlebracers超人拳">Battlebracers超人拳</option>
                        <option value="Weepinrepeater地雷弩">Weepinrepeater地雷弩</option>
                        <option value="Clarentblade王者劍">Clarentblade王者劍</option>
                        <option value="Heavycrossbow重弩">Heavycrossbow重弩</option>
                        <option value="Blazing火龍捲">Blazing火龍捲</option>
                        <option value="Brimstone火殞">Brimstone火殞</option>
                        <option value="Mistpiercer穿霧">Mistpiercer穿霧</option>
                        <option value="不在表上的死M武器">不在表上的死M武器</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-gray-300 block mb-1">備註</label>
                        <input type="text" id="modalInputRemark" placeholder="例如: 可切副手/迟到" 
                               class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:border-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-300 block mb-1">超頻準備 (OC)</label>
                        <select id="modalInputOc" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:border-amber-500 outline-none">
                            <option value="true">✅ 已備妥 OC</option>
                            <option value="false">❌ 未備 OC</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-black font-black rounded-xl shadow transition">
                        確認入坑
                    </button>
                    <button type="button" id="btnClearSlot" onclick="clearSlot()" class="hidden py-2.5 px-4 bg-rose-900/50 hover:bg-rose-800 text-rose-300 font-bold rounded-xl border border-rose-700/50 transition">
                        清空此坑
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const COMP_CATEGORIES = [
            {
                id: 'caller',
                title: '行 1: CALLER 叫陣指揮',
                icon: 'fa-crown',
                headerColor: 'text-cyan-950',
                badgeBg: 'bg-cyan-800/20 text-cyan-950',
                containerStyle: 'background-color: #a5f3fc; border-color: #06b6d4;',
                unfilledStyle: 'background-color: #cff4fe; border-color: #67e8f9;',
                filledStyle: 'background-color: #22d3ee; border-color: #0891b2;',
                textColor: 'text-cyan-950',
                subTextColor: 'text-cyan-900',
                slots: [
                    { id: 'caller_1', name: 'CALLER', weapon: 'CALLER' },
                    { id: 'caller_2', name: '2 caller', weapon: '2 caller' }
                ]
            },
            {
                id: 'tank',
                title: '行 2: TANK 坦克位',
                icon: 'fa-shield-halved',
                headerColor: 'text-fuchsia-950',
                badgeBg: 'bg-fuchsia-800/20 text-fuchsia-950',
                containerStyle: 'background-color: #f5d0fe; border-color: #e879f9;',
                unfilledStyle: 'background-color: #fae8ff; border-color: #f0abfc;',
                filledStyle: 'background-color: #e879f9; border-color: #c026d3;',
                textColor: 'text-fuchsia-950',
                subTextColor: 'text-fuchsia-900',
                slots: [
                    { id: 'tank_1', name: '坦克坑 1', weapon: '單手錘/風暴錘/雷霆錘/正手/釘錘' },
                    { id: 'tank_2', name: '坦克坑 2', weapon: '單手錘/風暴錘/雷霆錘/正手/釘錘' },
                    { id: 'incubus_1', name: '縮小坦克', weapon: 'Incubus縮小' }
                ]
            },
            {
                id: 'dps',
                title: '行 3: DPS 主力輸出',
                icon: 'fa-burst',
                headerColor: 'text-amber-950',
                badgeBg: 'bg-amber-800/20 text-amber-950',
                containerStyle: 'background-color: #fde68a; border-color: #f59e0b;',
                unfilledStyle: 'background-color: #fef3c7; border-color: #fcd34d;',
                filledStyle: 'background-color: #fbbf24; border-color: #d97706;',
                textColor: 'text-amber-950',
                subTextColor: 'text-amber-900',
                isDpsGroup: true,
                slots: [
                    { id: 'dps_spike', name: '刺拳 (平10)', weapon: 'Spike刺拳 (平10)', fixedWeapon: true },
                    { id: 'dps_realm', name: '裂域斧', weapon: 'Realmbreaker裂域斧', fixedWeapon: true },
                    { id: 'dps_3', name: 'DPS 坑 3', weapon: '下拉選擇武器' },
                    { id: 'dps_4', name: 'DPS 坑 4', weapon: '下拉選擇武器' },
                    { id: 'dps_5', name: 'DPS 坑 5', weapon: '下拉選擇武器' },
                    { id: 'dps_6', name: 'DPS 坑 6', weapon: '下拉選擇武器' },
                    { id: 'dps_7', name: 'DPS 坑 7', weapon: '下拉選擇武器' },
                    { id: 'dps_8', name: 'DPS 坑 8', weapon: '下拉選擇武器' }
                ]
            },
            {
                id: 'utility',
                title: '行 4: 破防 & 詛咒',
                icon: 'fa-skull',
                headerColor: 'text-blue-950',
                badgeBg: 'bg-blue-800/20 text-blue-950',
                containerStyle: 'background-color: #bfdbfe; border-color: #3b82f6;',
                unfilledStyle: 'background-color: #dbeafe; border-color: #93c5fd;',
                filledStyle: 'background-color: #60a5fa; border-color: #2563eb;',
                textColor: 'text-blue-950',
                subTextColor: 'text-blue-900',
                slots: [
                    { id: 'util_1', name: '索魂/斷水', weapon: 'Spirithunter索魂/Carving斷水' },
                    { id: 'util_2', name: '昭穎', weapon: 'shadowcaller昭穎' },
                    { id: 'util_3', name: '生咒', weapon: 'Corrupting Staff生咒' }
                ]
            },
            {
                id: 'healer',
                title: '行 5: HEALER 奶媽組',
                icon: 'fa-heart-pulse',
                headerColor: 'text-emerald-950',
                badgeBg: 'bg-emerald-800/20 text-emerald-950',
                containerStyle: 'background-color: #a7f3d0; border-color: #10b981;',
                unfilledStyle: 'background-color: #d1fae5; border-color: #6ee7b7;',
                filledStyle: 'background-color: #34d399; border-color: #059669;',
                textColor: 'text-emerald-950',
                subTextColor: 'text-emerald-900',
                slots: [
                    { id: 'heal_0', name: '版甲墮神', weapon: 'HallowFall版甲墮神' },
                    { id: 'heal_1', name: '墮神', weapon: 'HallowFall墮神' },
                    { id: 'heal_2', name: '墮落法杖', weapon: 'Fallen墮落法杖' },
                    { id: 'heal_3', name: '水晶奶', weapon: '水晶奶' }
                ]
            },
            {
                id: 'flex',
                title: '行 6: 補位 (Flex)',
                icon: 'fa-users-gear',
                headerColor: 'text-purple-950',
                badgeBg: 'bg-purple-800/20 text-purple-950',
                containerStyle: 'background-color: #e9d5ff; border-color: #a855f7;',
                unfilledStyle: 'background-color: #f3e8ff; border-color: #d8b4fe;',
                filledStyle: 'background-color: #c084fc; border-color: #9333ea;',
                textColor: 'text-purple-950',
                subTextColor: 'text-purple-900',
                isDpsGroup: true,
                slots: [
                    { id: 'flex_1', name: '補位坑 1', weapon: '自由補位 / 下拉武器' },
                    { id: 'flex_2', name: '補位坑 2', weapon: '自由補位 / 下拉武器' },
                    { id: 'flex_3', name: '補位坑 3', weapon: '自由補位 / 下拉武器' },
                    { id: 'flex_4', name: '補位坑 4', weapon: '自由補位 / 下拉武器' },
                    { id: 'flex_5', name: '補位坑 5', weapon: '自由補位 / 下拉武器' }
                ]
            }
        ];

        let currentSlot = '12';
        let activeModalSlot = null;
        let activeIsDps = false;

        let slotData = {
            '12': {},
            '14': {}
        };

        window.addEventListener('DOMContentLoaded', () => {
            startClock();
            renderBoard();
            updateCounts();
        });

        function startClock() {
            setInterval(() => {
                const now = new Date();
                const utcStr = now.toISOString().substr(11, 8) + ' UTC';
                const utcClockEl = document.getElementById('utcClock');
                if (utcClockEl) {
                    utcClockEl.innerText = utcStr;
                }

                const utcHour = now.getUTCHours();
                let targetHour = 12;
                if (utcHour >= 12 && utcHour < 14) {
                    targetHour = 14;
                } else if (utcHour >= 14) {
                    targetHour = 12;
                }

                const target = new Date(now);
                if (utcHour >= 14) {
                    target.setUTCDate(target.getUTCDate() + 1);
                }
                target.setUTCHours(targetHour, 0, 0, 0);

                const diff = target - now;
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                const ctaCountdownEl = document.getElementById('ctaCountdown');
                if (ctaCountdownEl) {
                    ctaCountdownEl.innerText = 
                        `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }
            }, 1000);
        }

        function selectSlot(time) {
            currentSlot = time;
            
            const btn12 = document.getElementById('btnSlot12');
            const btn14 = document.getElementById('btnSlot14');

            if (btn12 && btn14) {
                if (time === '12') {
                    btn12.className = 'btn-action flex-1 md:flex-initial px-6 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow-lg shadow-amber-500/20';
                    btn14.className = 'btn-action flex-1 md:flex-initial px-6 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-gray-800 text-gray-300 border border-gray-700';
                } else {
                    btn14.className = 'btn-action flex-1 md:flex-initial px-6 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow-lg shadow-amber-500/20';
                    btn12.className = 'btn-action flex-1 md:flex-initial px-6 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-gray-800 text-gray-300 border border-gray-700';
                }
            }

            renderBoard();
            updateCounts();
        }

        function renderBoard() {
            const container = document.getElementById('compGridContainer');
            if (!container) return;
            container.innerHTML = '';

            const currentData = slotData[currentSlot] || {};

            COMP_CATEGORIES.forEach(cat => {
                const categorySection = document.createElement('div');
                categorySection.className = `p-4 rounded-2xl border space-y-3 shadow-md`;
                categorySection.style = cat.containerStyle;

                categorySection.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h2 class="font-extrabold ${cat.headerColor} flex items-center gap-2 text-sm md:text-base">
                            <i class="fa-solid ${cat.icon}"></i> ${cat.title}
                        </h2>
                        <span class="text-xs px-2.5 py-0.5 rounded-full font-bold font-mono ${cat.badgeBg}">
                            ${cat.slots.filter(s => currentData[s.id]?.name).length} / ${cat.slots.length}
                        </span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                        ${cat.slots.map(s => {
                            const occupied = currentData[s.id];
                            const styleStr = occupied ? cat.filledStyle : cat.unfilledStyle;
                            const displayWeapon = occupied?.selectedWeapon || s.weapon;
                            const isDpsSelectable = cat.isDpsGroup && !s.fixedWeapon;
                            
                            return `
                                <div onclick="openSlotModal('${s.id}', '${s.name}', '${s.weapon.replace(/'/g, "\\'")}', ${isDpsSelectable ? true : false})" 
                                     style="${styleStr}"
                                     class="slot-card relative shadow-sm">
                                    <div class="text-xs font-black ${cat.subTextColor} truncate mb-1">
                                        ${displayWeapon}
                                    </div>
                                    ${occupied ? `
                                        <div class="flex items-center justify-between">
                                            <div class="font-black ${cat.textColor} truncate text-sm">
                                                👤 ${occupied.name}
                                            </div>
                                            <div class="flex items-center gap-1.5 text-xs font-bold font-mono ${cat.textColor}">
                                                <span class="truncate max-w-[80px]" title="${occupied.remark || ''}">${occupied.remark || ''}</span>
                                                ${occupied.oc === 'true' ? '<span class="text-amber-800" title="超頻已備妥">⚡</span>' : ''}
                                            </div>
                                        </div>
                                    ` : `
                                        <div class="text-xs ${cat.subTextColor} italic font-semibold flex items-center gap-1">
                                            <i class="fa-solid fa-plus text-[10px]"></i> 點擊坑位報名
                                        </div>
                                    `}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;

                container.appendChild(categorySection);
            });
        }

        function openSlotModal(slotId, slotName, defaultWeapon, isDps = false) {
            activeModalSlot = slotId;
            activeIsDps = isDps;
            const currentData = slotData[currentSlot][slotId] || {};

            document.getElementById('modalRoleTitle').innerText = `坑位報名: ${slotName}`;
            document.getElementById('modalWeaponSub').innerText = isDps ? '請选择具体的 DPS 武器类型' : `武器要求: ${defaultWeapon}`;

            const dpsDropdown = document.getElementById('dpsWeaponDropdownContainer');
            if (isDps) {
                dpsDropdown.classList.remove('hidden');
                document.getElementById('modalInputWeapon').value = currentData.selectedWeapon || 'RiftGlaive刺刀';
            } else {
                dpsDropdown.classList.add('hidden');
            }

            document.getElementById('modalInputName').value = currentData.name || '';
            document.getElementById('modalInputRemark').value = currentData.remark || '';
            document.getElementById('modalInputOc').value = currentData.oc || 'true';

            const btnClear = document.getElementById('btnClearSlot');
            if (currentData.name) {
                btnClear.classList.remove('hidden');
            } else {
                btnClear.classList.add('hidden');
            }

            const modal = document.getElementById('slotModal');
            modal.classList.add('flex');
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('slotModal');
            modal.classList.remove('flex');
            modal.style.display = 'none';
            activeModalSlot = null;
            activeIsDps = false;
        }

        function confirmSlot(e) {
            e.preventDefault();
            if (!activeModalSlot) return;

            const name = document.getElementById('modalInputName').value.trim();
            const remark = document.getElementById('modalInputRemark').value.trim();
            const oc = document.getElementById('modalInputOc').value;
            const selectedWeapon = activeIsDps ? document.getElementById('modalInputWeapon').value : null;

            if (name) {
                slotData[currentSlot][activeModalSlot] = {
                    name,
                    remark,
                    oc,
                    selectedWeapon
                };
            }

            closeModal();
            renderBoard();
            updateCounts();
        }

        function clearSlot() {
            if (!activeModalSlot) return;
            delete slotData[currentSlot][activeModalSlot];
            closeModal();
            renderBoard();
            updateCounts();
        }

        function updateCounts() {
            const data12 = slotData['12'];
            const data14 = slotData['14'];

            const count12 = Object.keys(data12).length;
            const count14 = Object.keys(data14).length;

            const el12 = document.getElementById('count12');
            const el14 = document.getElementById('count14');

            if (el12) el12.innerText = `${count12} 人`;
            if (el14) el14.innerText = `${count14} 人`;

            const totalSlotsCount = COMP_CATEGORIES.reduce((acc, cat) => acc + cat.slots.length, 0);
            const currentData = slotData[currentSlot] || {};
            const currentFilled = Object.keys(currentData).length;

            const elTotal = document.getElementById('totalCountDisplay');
            if (elTotal) elTotal.innerText = `${currentFilled} / ${totalSlotsCount}`;
        }

        function exportToDiscord() {
            const currentData = slotData[currentSlot];
            let text = `⚔️ **【Albion Online】${currentSlot}:00 UTC CTA 陣容名單** ⚔️\n`;
            text += `----------------------------------------\n`;

            COMP_CATEGORIES.forEach(cat => {
                text += `**${cat.title}**\n`;
                cat.slots.forEach(s => {
                    const filled = currentData[s.id];
                    const weaponName = filled?.selectedWeapon || s.weapon;
                    if (filled) {
                        const remarkText = filled.remark ? ` (${filled.remark})` : '';
                        text += `  • [${weaponName}] ${filled.name}${remarkText} ${filled.oc === 'true' ? '⚡' : ''}\n`;
                    } else {
                        text += `  • [${weaponName}] ❌ *【空位】*\n`;
                    }
                });
                text += `\n`;
            });

            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            alert(`✅ ${currentSlot}:00 UTC 名單已成功複製！直接至 Discord 貼上即可。`);
        }
    </script>
</body>
</html>
